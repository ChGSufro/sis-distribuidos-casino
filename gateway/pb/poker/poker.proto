syntax = "proto3";

package poker;

option go_package = "github.com/ChGSufro/sis-distribuidos-casino/poker/pb";

// ─────────────────────────────────────────────────────────
// Entidades del Dominio
// ─────────────────────────────────────────────────────────

// Carta del mazo. En Poker no lleva valor numerico:
// el valor se deriva de la posicion dentro de la mano.
message Card {
  string suit = 1; // "H" (Corazones), "D" (Diamantes), "C" (Treboles), "S" (Picas)
  string rank = 2; // "2".."10", "J", "Q", "K", "A"
}

// Mesa de poker. Entidad central del servicio.
message Table {
  string table_id          = 1; // ObjectId hex
  string name              = 2;
  int64  small_blind_cents = 3;
  int64  big_blind_cents   = 4;
  int32  max_players       = 5; // 2..10
  int32  current_players   = 6; // jugadores sentados actualmente
  string status            = 7; // "waiting", "active", "closed"
  string created_by        = 8; // user_id del creador (unica autoridad para cerrar)
}

// Jugador sentado en la mesa, sin informacion privada.
// username lo rellena el Gateway (enriquecimiento via UsersService);
// el dominio de poker solo maneja user_id.
message Seat {
  int32  seat_position = 1; // 0..max_players-1
  string user_id       = 2;
  int64  stack_cents   = 3;
  string status        = 4; // "active", "sitting_out", "left"
  string username      = 5; // rellenado por el Gateway
}

// Estado de un jugador dentro de la ronda en curso
message PlayerState {
  string user_id                   = 1;
  int32  seat_position             = 2; // 0..max_players-1
  int64  stack_cents               = 3;
  int64  total_bet_in_round_cents  = 4;
  string status                    = 5; // "active", "folded", "all_in"
  int64  street_bet_cents          = 6; // apostado en la calle actual
  string username                  = 7; // rellenado por el Gateway
}

// Accion registrada por un jugador durante la ronda
message Action {
  string user_id      = 1;
  string action       = 2; // "fold", "check", "call", "raise", "all-in"
  int64  amount_cents = 3; // fold/check=0, call=lo aportado, raise=monto TOTAL objetivo (raise-to)
  string timestamp    = 4; // ISO 8601
}

// Bote secundario generado por all-in. eligible_players son los
// userId que pueden disputarlo.
message SidePot {
  int64           amount_cents     = 1;
  repeated string eligible_players = 2;
}

// Ganador de un bote al cerrar la ronda
message Winner {
  string user_id      = 1;
  string pot_type     = 2; // "main", "side"
  int64  amount_cents = 3;
}

// Cartas privadas reveladas al showdown (solo contendientes no retirados).
message PlayerReveal {
  string       user_id      = 1;
  int32        seat_position = 2;
  repeated Card hole_cards   = 3;
  string       hand_name     = 4; // tipo de mano evaluada ("Par", "Escalera", ...)
}

// Ronda en curso. your_hole_cards contiene solo las cartas
// privadas del usuario que consulta; reveals contiene las cartas
// de los rivales SOLO si la ronda termino en showdown.
message RoundState {
  string         round_id          = 1;
  string         stage             = 2;  // "waiting", "preflop", "flop", "turn", "river", "settled"
  repeated Card  community_cards   = 3;
  repeated Card  your_hole_cards   = 4;
  int64          pot_size_cents    = 5;  // bote calculado en vivo (suma de apuestas)
  int64          current_bet_cents = 6;  // apuesta a igualar en la ronda vigente
  int32          current_turn      = 7;  // seat_position del siguiente en actuar
  string         turn_expires_at   = 8;  // ISO 8601
  int32          dealer_position   = 9;  // seat_position del dealer
  repeated Action  actions         = 10; // acciones de la ronda en orden
  repeated SidePot side_pots       = 11; // botes secundarios activos
  repeated PlayerState players     = 12; // todos los jugadores de la ronda (stacks, apuestas, folded/all_in)
  repeated Winner   winners        = 13; // vacio hasta showdown/settled
  repeated PlayerReveal reveals    = 14; // cartas rivales, solo en showdown/settled
  int64          last_raise_cents  = 15; // tamano del ultimo raise completo de la calle
  int64          min_raise_to_cents = 16; // monto TOTAL minimo para "raise" (raise-to)
}

// Difusion del estado de la mesa a todos los jugadores sentados
message TableUpdate {
  string             round_id          = 1;
  string             stage             = 2;
  int32              current_turn      = 3;
  int64              current_bet_cents = 4;
  int64              pot_size_cents    = 5;
  repeated Card      community_cards   = 6;
  repeated PlayerState players         = 7;
  string             turn_expires_at   = 8; // ISO 8601
  repeated Winner    winners           = 9; // vacio mientras stage != "settled"
  int32              dealer_position   = 10;
  repeated Action    actions           = 11;
  repeated SidePot   side_pots         = 12;
  repeated PlayerReveal reveals        = 13; // cartas rivales, solo si hubo showdown
  int64              last_raise_cents  = 14; // tamano del ultimo raise completo de la calle
  int64              min_raise_to_cents = 15; // monto TOTAL minimo para "raise" (raise-to)
}

// ─────────────────────────────────────────────────────────
// Mensajes de Solicitud y Respuesta
// ─────────────────────────────────────────────────────────

// Listado de mesas, opcionalmente filtrado por estado.
// Con status_filter vacio se devuelven todas salvo las cerradas.
message ListTablesRequest {
  string status_filter = 1; // "waiting", "active", "closed", o vacio = todas menos "closed"
}

message ListTablesResponse {
  repeated Table tables = 1;
}

// Creacion de una mesa por parte de un usuario.
// Si buy_in_amount_cents > 0, el creador queda sentado en la mesa
// (el buy-in se reserva via Wallet.Hold) y se responden seat/hold.
message CreateTableRequest {
  string user_id           = 1; // usuario que crea la mesa
  string name              = 2;
  int64  small_blind_cents = 3;
  int64  big_blind_cents   = 4;
  int32  max_players       = 5; // 2..10
  int64  buy_in_amount_cents = 6; // 0 = solo crear (el creador no se sienta)
  int64  min_buy_in_cents    = 7; // 0 = default (10 big blinds)
  int64  max_buy_in_cents    = 8; // 0 = default (200 big blinds)
}

message CreateTableResponse {
  Table table = 1; // recien creada
  int32  seat_position = 2; // asiento del creador si compro fichas (-1 si no se sento)
  string hold_id       = 3; // referencia al hold en Wallet (vacio si no se sento)
}

// Compra de fichas y asignacion de asiento.
// El buy-in se reserva internamente via Wallet.Hold.
message JoinTableRequest {
  string table_id            = 1;
  string user_id             = 2;
  int64  buy_in_amount_cents = 3; // > 0
  int32  preferred_seat      = 4; // -1 = asignar el primer asiento libre
}

message JoinTableResponse {
  string table_id      = 1;
  int32  seat_position = 2; // 0..max_players-1
  int64  stack_cents   = 3; // fichas acreditadas en mesa
  string hold_id       = 4; // referencia a la reserva en Wallet
}

// Salida de la mesa. El stack se liquida via Wallet.Settle.
message LeaveTableRequest {
  string table_id = 1;
  string user_id  = 2;
}

message LeaveTableResponse {
  string table_id             = 1;
  int64  final_stack_cents    = 2; // fichas al momento de salir
  int64  settled_amount_cents = 3; // monto devuelto a la billetera
}

// Accion del jugador en su turno de la ronda en curso
message PlayerActionRequest {
  string table_id     = 1;
  string round_id     = 2;
  string user_id      = 3;
  string action       = 4; // "fold", "check", "call", "raise", "all-in"
  int64  amount_cents = 5; // monto del raise, requerido solo para "raise"
}

message PlayerActionResponse {
  TableUpdate update = 1; // se difunde a todos los jugadores de la mesa
}

// Consulta del estado completo de una mesa.
// user_id determina que cartas privadas se incluyen.
message GetTableStateRequest {
  string table_id = 1;
  string user_id  = 2;
}

message GetTableStateResponse {
  Table       table         = 1;
  repeated Seat seats        = 2;
  RoundState  current_round = 3; // vacio si la mesa no tiene ronda en curso
}

// Cierre definitivo de una mesa. Solo el creador puede cerrarla y
// solo si no hay jugadores sentados. Pasa a status = "closed",
// que ListTables ya excluye por defecto del lobby.
message CloseTableRequest {
  string table_id = 1;
  string user_id  = 2; // debe ser el creador de la mesa
}

message CloseTableResponse {
  string table_id = 1;
  string status   = 2; // "closed"
}

// ─────────────────────────────────────────────────────────
// Definición del Servicio gRPC
// ─────────────────────────────────────────────────────────

service PokerService {
  rpc ListTables    (ListTablesRequest)    returns (ListTablesResponse);
  rpc CreateTable   (CreateTableRequest)   returns (CreateTableResponse);
  rpc JoinTable     (JoinTableRequest)     returns (JoinTableResponse);
  rpc LeaveTable    (LeaveTableRequest)    returns (LeaveTableResponse);
  rpc PlayerAction  (PlayerActionRequest)  returns (PlayerActionResponse);
  rpc GetTableState (GetTableStateRequest) returns (GetTableStateResponse);
  rpc CloseTable    (CloseTableRequest)    returns (CloseTableResponse);
}
