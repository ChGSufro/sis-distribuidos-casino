syntax = "proto3";

package stats;

option go_package = "github.com/ChGSufro/sis-distribuidos-casino/stats/pb";

// ─────────────────────────────────────────────────────────
// Entidades del Dominio
// ─────────────────────────────────────────────────────────

// Evento de juego emitido por History Service
message GameEvent {
  string event_id  = 1; // UUID del evento
  string user_id   = 2; // Identificador del jugador
  string game_type = 3; // "blackjack" | "poker"
  string action    = 4; // "hand_result" | "bet_placed" | "hand_cancelled" |
                        // "table_result" | "player_buyin" | "player_payout" |
                        // "player_eliminated"
  string details   = 5; // JSON con el contenido variable segun la accion
  string timestamp = 6; // Formato ISO 8601
}

// Entrada del ranking de un jugador
message LeaderboardEntry {
  int32  rank         = 1;
  string user_id      = 2;
  string username     = 3;
  int64  score_cents  = 4;
  int32  games_played = 5;
}

// ─────────────────────────────────────────────────────────
// Mensajes de Solicitud y Respuesta
// ─────────────────────────────────────────────────────────

// Confirmación del stream de eventos recibidos
message StreamAck {
  int32  received_count = 1;
  string status         = 2; // "received"
}

message GetPlayerStatsRequest {
  string user_id = 1;
}

message GetPlayerStatsResponse {
  string user_id             = 1;
  int64  total_wagered_cents = 2;
  int64  total_won_cents     = 3;
  int64  net_profit_cents    = 4;
  int32  games_played        = 5;
  double win_rate            = 6; // 0.0 - 1.0
  int64  largest_win_cents   = 7;
  int32  current_streak      = 8; // positivo = victorias, negativo = derrotas
  int32  best_streak         = 9;
  string last_updated        = 10; // Formato ISO 8601
}

message GetPlayerGameStatsRequest {
  string user_id   = 1;
  string game_type = 2; // "blackjack" | "poker"
}

message GetPlayerGameStatsResponse {
  string user_id             = 1;
  string game_type           = 2; // "blackjack" | "poker"
  int32  games_played        = 3;
  int64  total_wagered_cents = 4;
  int64  total_won_cents     = 5;
  int64  largest_win_cents   = 6;
  string last_updated        = 7; // Formato ISO 8601
}

message GetLeaderboardRequest {
  string period = 1; // "daily" | "weekly" | "monthly" | "all_time"
  int32  limit  = 2;
}

message GetLeaderboardResponse {
  string                    period       = 1;
  string                    period_start = 2; // Formato ISO 8601
  repeated LeaderboardEntry entries      = 3;
  string                    computed_at  = 4; // Formato ISO 8601
}

// ─────────────────────────────────────────────────────────
// Definición del Servicio gRPC
// ─────────────────────────────────────────────────────────

service StatsService {
  rpc StreamGameEvents   (stream GameEvent)          returns (StreamAck);
  rpc GetPlayerStats     (GetPlayerStatsRequest)      returns (GetPlayerStatsResponse);
  rpc GetPlayerGameStats (GetPlayerGameStatsRequest)  returns (GetPlayerGameStatsResponse);
  rpc GetLeaderboard     (GetLeaderboardRequest)      returns (GetLeaderboardResponse);
}